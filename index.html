<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseScores - Team Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="logo-icon">⚡</span>
        <h1 class="app-title">PulseScores</h1>
      </div>
      
      <div class="header-actions">
        <!-- Favorite Team Selector (All 30 NBA Teams) -->
        <div class="favorite-picker-wrapper">
          <label for="favorite-select" class="sr-only">Select Favorite Team</label>
          <select id="favorite-select" class="favorite-select" aria-label="Select your favorite team">
            <option value="" disabled selected>⭐ Select Team</option>
            <option value="ATL">🏀 Atlanta Hawks</option>
            <option value="BOS">🏀 Boston Celtics</option>
            <option value="BKN">🏀 Brooklyn Nets</option>
            <option value="CHA">🏀 Charlotte Hornets</option>
            <option value="CHI">🏀 Chicago Bulls</option>
            <option value="CLE">🏀 Cleveland Cavaliers</option>
            <option value="DAL">🏀 Dallas Mavericks</option>
            <option value="DEN">🏀 Denver Nuggets</option>
            <option value="DET">🏀 Detroit Pistons</option>
            <option value="GSW">🏀 Golden State Warriors</option>
            <option value="HOU">🏀 Houston Rockets</option>
            <option value="IND">🏀 Indiana Pacers</option>
            <option value="LAC">🏀 Los Angeles Clippers</option>
            <option value="LAL">🏀 Los Angeles Lakers</option>
            <option value="MEM">🏀 Memphis Grizzlies</option>
            <option value="MIA">🏀 Miami Heat</option>
            <option value="MIL">🏀 Milwaukee Bucks</option>
            <option value="MIN">🏀 Minnesota Timberwolves</option>
            <option value="NOP">🏀 New Orleans Pelicans</option>
            <option value="NYK">🏀 New York Knicks</option>
            <option value="OKC">🏀 Oklahoma City Thunder</option>
            <option value="ORL">🏀 Orlando Magic</option>
            <option value="PHI">🏀 Philadelphia 76ers</option>
            <option value="PHX">🏀 Phoenix Suns</option>
            <option value="POR">🏀 Portland Trail Blazers</option>
            <option value="SAC">🏀 Sacramento Kings</option>
            <option value="SAS">🏀 San Antonio Spurs</option>
            <option value="TOR">🏀 Toronto Raptors</option>
            <option value="UTA">🏀 Utah Jazz</option>
            <option value="WAS">🏀 Washington Wizards</option>
          </select>
        </div>

        <!-- Auth Controls Container (Sign In, Dynamic Email Badge, and Sign Out) -->
        <div class="auth-controls" style="display: flex; align-items: center; gap: 0.5rem;">
          <button id="auth-modal-btn" class="auth-btn">Sign In</button>
          <button id="logout-btn" class="auth-btn logout-btn hidden" style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Dashboard -->
  <main class="main-layout">
    
    <!-- Status & Info Bar -->
    <div class="info-bar">
      <div class="update-status" id="update-status" aria-live="polite">
        <span class="status-indicator live" id="status-dot"></span>
        <span id="last-updated-text">Connecting to Supabase...</span>
      </div>
      <button id="manual-refresh-btn" class="refresh-button" aria-label="Refresh scores">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        <span>Refresh</span>
      </button>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="error-banner hidden" role="alert">
      <span>⚠️ Supabase connection issue. Retrying...</span>
    </div>

    <!-- Favorite Team Spotlight Section -->
    <section id="favorite-section" class="favorite-spotlight-section">
      <h2 class="section-label">Your Team</h2>
      <div id="favorite-game-container">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Other Today's Games Section -->
    <section class="other-games-section">
      <h2 class="section-label" id="other-games-heading">Other Games Today</h2>
      <div id="other-games-container" class="games-grid">
        <!-- Rendered via JS -->
      </div>
    </section>

  </main>

  <!-- Login/Signup Modal -->
  <div id="auth-modal" class="auth-modal hidden">
    <div class="auth-modal-content">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h3 id="auth-modal-title">Welcome to PulseScores</h3>
      <p class="auth-subtitle">Sign in to sync your favorite team across devices.</p>
      
      <form id="auth-form">
        <div class="form-group">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" required placeholder="you@college.edu">
        </div>
        <div class="form-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" required placeholder="••••••••">
        </div>
        <div id="auth-error" class="auth-error hidden"></div>
        <button type="submit" id="auth-submit-btn" class="primary-btn">Sign In</button>
      </form>
      
      <p class="auth-switch-text">
        <span id="auth-switch-mode">Don't have an account? <a href="#" id="toggle-mode-link">Sign Up</a></span>
      </p>
    </div>
  </div>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
